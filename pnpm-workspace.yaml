minimumReleaseAge: 10080  # only resolve package versions published >= 1 week ago (supply-chain caution)

minimumReleaseAgeExclude:
  # Platform binaries are excluded from the age gate ONLY because they are exact-pinned to
  # their (gated) parent version and get re-published on rebuilds, so a fresh timestamp
  # does not indicate a fresh release. Everything else must satisfy minimumReleaseAge.
  - '@next/swc-*'  # next.js compiler binaries - exact-pinned to the gated next version
  - '@rollup/rollup-*'  # rollup platform binaries - exact-pinned to rollup (held at 4.64.7)
  - '@esbuild/*'  # esbuild platform binaries - exact-pinned by each esbuild release
  - '@swc/*'  # swc platform binaries - exact-pinned by their parent packages
  - '@lightningcss/*'  # lightningcss platform binaries - exact-pinned per release
  - '@cloudflare/workerd-*'  # workerd binaries - exact-pinned to wrangler
  - '@tailwindcss/oxide-*'  # tailwind oxide binaries - exact-pinned to tailwindcss
  - '@img/sharp-*'  # sharp image binaries - exact-pinned to sharp
  - '@biomejs/biome-*'  # biome binaries - exact-pinned to the biome cli
  - '@nx/nx-*'  # nx platform binaries - exact-pinned to nx

# pnpm 12 made unreviewed dependency build scripts a hard error (strictDepBuilds defaults to
# true; pnpm 10 only warned) and replaced onlyBuiltDependencies/ignoredBuiltDependencies with
# the allowBuilds map. Each entry below is reviewed and denied: none of these need their
# postinstall here - prebuilt native bindings ship via optionalDependencies (@esbuild/*,
# @parcel/watcher, msgpackr-extract, secp256k1), nx and workerd run from their platform
# binaries, and CI provides the foundry toolchain and the cypress binary explicitly (see
# website-e2e.yml). This records the same "no dependency scripts run" posture the repo
# already shipped with under pnpm 10.
allowBuilds:
  '@foundry-rs/anvil': false
  '@parcel/watcher': false
  contentlayer2: false
  cypress: false
  es5-ext: false
  esbuild: false
  msgpackr-extract: false
  nx: false
  redis-memory-server: false
  secp256k1: false
  workerd: false
packages:
  - packages/*
  - examples/*
overrides:
  # @redstone-finance/evm-connector@1.0.0 (2026-08-31) is a broken publish: its npm manifest
  # leaks workspace:* deps (@redstone-finance/protocol et al.) that cannot resolve outside the
  # redstone monorepo. Hold at 0.9.0, the last clean publish - it exact-pins its own 0.9.0
  # siblings, so this override fully determines the @redstone-finance subtree (pulled in
  # transitively by erc7412's auto-installed peer deps).
  '@redstone-finance/evm-connector': '0.9.0'
  # --- pnpm 12 native minimumReleaseAge enforcement (lockfile verification) -----------------
  # pnpm 12 verifies every lockfile entry against minimumReleaseAge at install time, where
  # pnpm 10 only gated new resolutions - so the v10 lockfile silently contained versions
  # published <7d ago. After the v12 lockfile rebuild, these packages' newest in-range
  # versions were still <7d old; each is held below at its newest >=7d-old ("mature")
  # version. Remove a pin once the newest release of that package has matured (>=1 week old)
  # and a fresh `pnpm install` resolves past it. Release families move in lockstep and are
  # pinned to mutually consistent versions.
  '@aws-sdk/checksums': '3.1001.3'
  '@aws-sdk/client-s3': '3.1152.0'
  '@aws-sdk/core': '3.978.3'
  '@aws-sdk/credential-provider-env': '3.972.74'
  '@aws-sdk/credential-provider-http': '3.972.76'
  '@aws-sdk/credential-provider-ini': '3.973.19'
  '@aws-sdk/credential-provider-login': '3.972.81'
