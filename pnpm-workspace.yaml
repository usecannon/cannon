  '@aws-sdk/credential-provider-sso': '3.973.18'
  '@aws-sdk/credential-provider-web-identity': '3.972.80'
  '@aws-sdk/middleware-sdk-s3': '3.972.79'
  '@aws-sdk/nested-clients': '3.997.48'
  '@aws-sdk/signature-v4-multi-region': '3.996.48'
  '@aws-sdk/token-providers': '3.1152.0'
  '@aws-sdk/types': '3.974.6'
  '@smithy/core': '3.36.0'
  '@next/bundle-analyzer': '16.4.2'  # keep in lockstep with next
  '@next/env': '16.4.2'  # keep in lockstep with next
  '@next/third-parties': '16.4.2'  # keep in lockstep with next
