minimumReleaseAge: 10080  # only resolve package versions published >= 1 week ago (supply-chain caution)

minimumReleaseAgeExclude:
  # Platform binaries are excluded from the age gate ONLY because they are exact-pinned to
  # their (gated) parent version and get re-published on rebuilds, so a fresh timestamp
  # does not indicate a fresh release. Everything else must satisfy minimumReleaseAge.
  - '@next/swc-*'  # next.js compiler binaries - exact-pinned to the gated next version
  - '@rollup/rollup-*'  # rollup platform binaries - exact-pinned to rollup (held at 4.64.7)
  - '@esbuild/*'  # esbuild platform binaries - exact-pinned by each esbuild release
  - '@swc/*'  # swc platform binaries - exact-pinned by their parent packages
  - '@lightningcss/*'  # lightningcss platform binaries - exact-pinned per release
  - '@cloudflare/workerd-*'  # workerd binaries - exact-pinned to wrangler
  - '@tailwindcss/oxide-*'  # tailwind oxide binaries - exact-pinned to tailwindcss
  - '@img/sharp-*'  # sharp image binaries - exact-pinned to sharp
  - '@biomejs/biome-*'  # biome binaries - exact-pinned to the biome cli
  - '@nx/nx-*'  # nx platform binaries - exact-pinned to nx
packages:
  - packages/*
  - examples/*
overrides:
  protobufjs@<7.6.3: '>=7.6.3'  # GHSA-xq3m-2v4x-88gg (critical RCE) + 10 more advisories; clears the vulnerable 6.11.6 chain under ipfs-only-hash
  wrangler: '4.151.1'
  sass: '1.105.2'
